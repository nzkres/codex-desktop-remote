name: Android

on:
  push:
    paths:
      - 'android-native/**'
      - 'third-party/licenses/**'
      - 'scripts/check_versions.py'
      - 'scripts/check_android_apk.py'
      - 'scripts/check_android_trust.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - 'third-party/licenses/**'
      - 'scripts/check_versions.py'
      - 'scripts/check_android_apk.py'
      - 'scripts/check_android_trust.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      signed_ota:
        description: 'Build a controlled-signature test APK with provisioned OTA trust (main only)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check component release histories
        run: python -B scripts/check_versions.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install controlled-signing verification dependency
        if: github.event_name == 'workflow_dispatch' && inputs.signed_ota
        run: python -m pip install -r updates/requirements.txt
      - name: Prepare externally provisioned OTA trust and signer
        if: github.event_name == 'workflow_dispatch' && inputs.signed_ota
        env:
          UPDATE_TRUST_JSON: ${{ secrets.ANDROID_UPDATE_TRUST_JSON }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Controlled OTA test signing requires main.' >&2
            exit 1
          fi
          for value in "$UPDATE_TRUST_JSON" "$SIGNING_KEYSTORE_BASE64" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" "$EXPECTED_CERT_SHA256"; do
            if [[ -z "$value" ]]; then
              echo 'Controlled OTA signing configuration is incomplete.' >&2
              exit 1
            fi
          done
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'Controlled OTA certificate fingerprint is invalid.' >&2
            exit 1
          fi
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/android-ota.XXXXXX")
          trust_file="$private_dir/update-trust.json"
          keystore_file="$private_dir/signing.p12"
          # Register cleanup paths even if decoding or preflight subsequently fails.
          {
            echo "DESKTOP_REMOTE_ANDROID_UPDATE_TRUST=$trust_file"
            echo "DESKTOP_REMOTE_ANDROID_KEYSTORE=$keystore_file"
          } >> "$GITHUB_ENV"
          printf '%s' "$UPDATE_TRUST_JSON" > "$trust_file"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          python -B -m scripts.check_android_trust --trust "$trust_file"
      # Branch/PR output has empty OTA trust and an ephemeral debug signer; it is never a production OTA artifact.
      - name: Unit tests, lint, and untrusted debug APKs
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_ota
        working-directory: android-native
        run: bash ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Unit tests, lint, and controlled-signature test APKs
        if: github.event_name == 'workflow_dispatch' && inputs.signed_ota
        working-directory: android-native
        env:
          DESKTOP_REMOTE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          DESKTOP_REMOTE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          DESKTOP_REMOTE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify version and release notes inside APK
        run: python -B scripts/check_android_apk.py
      - name: Run isolated target-selection and notification UI regressions
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_ota
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name cdr-regression --package 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/cdr-regression.avd"
          avd_config="$ANDROID_AVD_HOME/cdr-regression.avd/config.ini"
          test -f "$avd_config"
          sed -i '/^disk\.dataPartition\.size[[:space:]]*=/d' "$avd_config"
          printf 'disk.dataPartition.size=2048M\n' >> "$avd_config"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq cdr-regression; then
            echo 'Created AVD is not visible to the emulator.' >&2
            avdmanager list avd
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          df -h "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -avd cdr-regression -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on > "$RUNNER_TEMP/cdr-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'result=$?; if [[ $result -ne 0 ]]; then echo "Emulator diagnostics:"; timeout 10 adb devices -l || true; tail -n 120 "$RUNNER_TEMP/cdr-emulator.log" || true; fi; timeout 10 adb -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator exited before registering or completing boot.' >&2
              exit 1
            fi
            if [[ "$(timeout 10 adb -s emulator-5554 get-state 2>/dev/null || true)" == 'device' ]] && \
               [[ "$(timeout 10 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == '1' ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then echo 'Emulator did not finish booting within the 90-attempt limit.' >&2; exit 1; fi
          adb -s emulator-5554 shell input keyevent 82
          cd android-native
          bash ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.codex.remote.MainActivityTargetSelectionTest,dev.codex.remote.TaskTargetSwitchUiTest,dev.codex.remote.TerminalControlUiTest,dev.codex.remote.NotificationServiceTest
      - name: Verify controlled APK signing certificate
        if: github.event_name == 'workflow_dispatch' && inputs.signed_ota
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          tool = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0' / 'apksigner'
          apk = pathlib.Path('android-native/app/build/outputs/apk/debug/app-debug.apk')
          result = subprocess.run([str(tool), 'verify', '--min-sdk-version', '26',
                                   '--verbose', '--print-certs', str(apk)],
                                  capture_output=True, text=True)
          found = re.findall(r'certificate SHA-256 digest:\s*([a-fA-F0-9]{64})', result.stdout)
          expected = os.environ['EXPECTED_CERT_SHA256'].lower()
          if result.returncode or not re.search(r'Number of signers:\s*1', result.stdout) or not found or any(x.lower() != expected for x in found):
              raise SystemExit('Controlled APK signing verification failed.')
          print('Controlled APK signing certificate verified.')
          PY
      - name: Verify approved trust bytes inside controlled APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_ota
        run: python -B -m scripts.check_android_trust --trust "$DESKTOP_REMOTE_ANDROID_UPDATE_TRUST" --apk android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Save untrusted debug APK and reports
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.signed_ota)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-remote-android-debug
          retention-days: 14
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/debug/output-metadata.json
            android-native/app/build/reports/
          if-no-files-found: warn
      - name: Save verified controlled-signature test APK and reports
        if: success() && github.event_name == 'workflow_dispatch' && inputs.signed_ota
        uses: actions/upload-artifact@v4
        with:
          name: desktop-remote-android-ota-test
          retention-days: 14
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/debug/output-metadata.json
            android-native/app/build/reports/
          if-no-files-found: error
      - name: Remove temporary signing inputs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.signed_ota
        run: |
          if [[ -n "${DESKTOP_REMOTE_ANDROID_UPDATE_TRUST:-}" ]]; then rm -f -- "$DESKTOP_REMOTE_ANDROID_UPDATE_TRUST"; fi
          if [[ -n "${DESKTOP_REMOTE_ANDROID_KEYSTORE:-}" ]]; then rm -f -- "$DESKTOP_REMOTE_ANDROID_KEYSTORE"; fi

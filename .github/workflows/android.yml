name: Android

on:
  push:
    paths:
      - 'android-native/**'
      - 'third-party/licenses/**'
      - 'scripts/check_versions.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - 'third-party/licenses/**'
      - 'scripts/check_versions.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check component release histories
        run: python -B scripts/check_versions.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, and debug APKs
        working-directory: android-native
        run: bash ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Save test APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-remote-android-debug
          retention-days: 14
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/reports/
          if-no-files-found: warn
